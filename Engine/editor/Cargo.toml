[package]
name = "tellurium-editor"
version = "0.1.0"
edition = "2021"

[dependencies]
tellurium-serialization = { path = "../serialization" }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
rfd = { version = "0.15", default-features = false }
resvg = { version = "0.45", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
glam = "0.30"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
log = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tempfile = "3"
tellurium-assets = { path = "../assets" }
tellurium-diagnostics = { path = "../diagnostics" }
