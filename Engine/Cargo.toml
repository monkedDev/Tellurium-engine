[workspace]
resolver = "2"
exclude = ["editor"]
members = [
    "bridge",
    "input",
    "assets",
    "physics-cpp",
    "audio-cpp",
    "platform",
    "core",
    "scripting",
    "serialization",
    "builder",
    "diagnostics",
    "safety",
    "runtime",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[profile.release]
opt-level = 3
debug = 0

[profile.dev]
opt-level = 0
debug = 2
